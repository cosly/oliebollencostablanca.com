# Cloudflare Pages configuration
name = "oliebollencostablanca"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

# Environment variables
[vars]
ENVIRONMENT = "production"

# Secrets (set these via: wrangler pages secret put <KEY>)
# RESEND_API_KEY = "your-resend-api-key"
# ADMIN_EMAIL = "admin@oliebollencostablanca.com"
# ADMIN_SECRET = "your-secret-key-for-hmac"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "oliebollen-db"
database_id = "4a8bb02f-c23d-42d1-a156-01bf81970717"

# Note: Durable Objects binding must be configured in Cloudflare dashboard
# The OrderSession class is exported from _worker.js
